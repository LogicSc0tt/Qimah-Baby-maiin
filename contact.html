<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Qimah</title>
  <meta name="description" content="Get in touch with Qimah." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="extra.css" />
</head>

<body>
  <header class="site-header" id="site-header"></header>
  <aside id="cart-panel" class="cart-panel" aria-label="Shopping cart"></aside>

  <div class="page-head">
    <h1>Contact us</h1>
    <p>Questions about sizes, orders or delivery? Send us a message and we will reply on WhatsApp.</p>
  </div>

  <main class="section">
    <div class="box" style="max-width: 560px;">

      <form id="contact-form" class="form">
        <label>Your name
          <input type="text" name="fullname" required />
        </label>
        <label>Phone number
          <input type="tel" name="phone" required />
        </label>
        <label>Message
          <textarea name="message" rows="5" required></textarea>
        </label>
        <button type="submit" class="btn btn-solid">Send on WhatsApp</button>
      </form>
      <p id="contact-done" class="form-note" role="status"></p>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
